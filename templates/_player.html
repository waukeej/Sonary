<footer
  class="player-bar"
  data-player-user="{{ g.user.user_id if g.user else '' }}"
>
  <div class="player-controls-container">
    <div class="player-track-info">
      <img
        class="player-cover"
        src="{{ url_for('static', filename='images/cover-1.svg') }}"
        alt="Обложка текущего трека"
      />
      <div class="player-text">
        <div class="title">название</div>
        <div class="artist">исполнитель</div>
      </div>
    </div>
    <div class="player-buttons">
      <button
        class="player-icon-btn"
        type="button"
        title="Предыдущий трек"
        aria-label="Предыдущий трек"
      >
        <i class="bi bi-skip-start"></i>
      </button>
      <button
        class="player-icon-btn main-play"
        type="button"
        title="Воспроизвести"
        aria-label="Воспроизвести"
      >
        <i class="bi bi-play-fill"></i>
      </button>
      <button
        class="player-icon-btn"
        type="button"
        title="Следующий трек"
        aria-label="Следующий трек"
      >
        <i class="bi bi-skip-end"></i>
      </button>
    </div>
    <div class="player-actions" aria-label="Действия плеера">
      <div class="player-volume" data-volume-control>
        <button
          class="player-icon-btn"
          type="button"
          data-volume-toggle
          aria-label="Громкость"
          title="Громкость"
          aria-expanded="false"
          aria-controls="playerVolumePopup"
        >
          <i class="bi bi-volume-up"></i>
        </button>
        <div class="player-volume-popup" id="playerVolumePopup" inert>
          <div class="player-volume-surface">
            <output data-volume-value aria-live="off">100%</output>
            <input
              data-volume-slider
              type="range"
              min="0"
              max="100"
              step="1"
              value="100"
              aria-label="Громкость"
              aria-orientation="vertical"
            />
            <button
              class="player-icon-btn"
              data-volume-mute
              type="button"
              aria-label="Выключить звук"
              title="Выключить звук"
              aria-pressed="false"
            >
              <i class="bi bi-volume-up"></i>
            </button>
          </div>
        </div>
      </div>
      <button
        class="player-icon-btn"
        type="button"
        title="Очередь"
        aria-label="Очередь"
      >
        <i class="bi bi-music-note-list"></i>
      </button>
      <button
        class="player-icon-btn"
        type="button"
        title="Добавить в плейлист"
        aria-label="Добавить в плейлист"
      >
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
  </div>
  <div class="player-progress-row">
    <time class="player-current-time" datetime="PT1M40S">1:40</time>
    <input
      class="progress-container track-progress-slider"
      type="range"
      min="0"
      max="100"
      value="45"
      step="1"
      data-duration="222"
      aria-label="Позиция воспроизведения"
    />
    <time class="player-remaining-time" datetime="PT2M2S">−2:02</time>
  </div>
</footer>
