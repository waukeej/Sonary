<div class="filter-area">
  <section class="filter-bar" id="filtersPanel" aria-label="Фильтры записей">
    <label class="filter-field filter-field-icon"
      ><i class="bi bi-emoji-smile" aria-hidden="true"></i
      ><select id="moodFilter" aria-label="Настроение">
        <option value="">Настроение</option>
        <option value="happy">Радостное</option>
        <option value="calm">Спокойное</option>
        <option value="sad">Грустное</option>
        <option value="energetic">Энергичное</option>
      </select></label
    >
    <label class="filter-field filter-field-icon"
      ><i class="bi bi-filter" aria-hidden="true"></i
      ><select id="trackSort" aria-label="Сортировка треков">
        <option value="">Сортировка</option>
        <option value="best">Сначала лучшие</option>
        <option value="worst">Сначала худшие</option>
        <option value="long">Сначала долгие</option>
        <option value="short">Сначала короткие</option>
      </select></label
    >
    <div class="filter-form-actions">
      <button class="reset-filters-btn" type="button">Сбросить</button>
    </div>
    <div class="filter-actions" aria-label="Действия с записями">
      <button
        id="viewToggleBtn"
        type="button"
        title="Изменить вид"
        aria-label="Изменить вид"
      >
        <i class="bi bi-grid"></i></button
      ><button
        id="addTrackBtn"
        type="button"
        title="Добавить запись"
        aria-label="Добавить запись"
      >
        <i class="bi bi-clipboard-plus"></i></button
      ><button
        id="deleteTrackBtn"
        type="button"
        title="Удалить записи"
        aria-label="Удалить записи"
      >
        <i class="bi bi-clipboard-x"></i>
      </button>
    </div>
  </section>
</div>
