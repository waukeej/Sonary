<div class="creation-modal" id="reviewEditModal" hidden>
  <form
    class="creation-window review-edit-window"
    id="reviewEditForm"
    method="post"
    action="{{ url_for('diary.edit', track_id=track.id) }}"
    enctype="multipart/form-data"
    data-diary-form
    novalidate
  >
    <div class="creation-header">
      <div>
        <p class="creation-eyebrow">Отзыв</p>
        <h2>Редактировать отзыв</h2>
      </div>
      <button
        class="creation-close"
        type="button"
        data-close-review
        aria-label="Закрыть"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="creation-body">
      {% set editing = true %}{% include 'components/track_fields.html' %}
    </div>
    <div class="creation-footer">
      <button class="settings-secondary" type="button" data-close-review>
        Отмена</button
      ><button class="creation-submit" type="submit">Сохранить</button>
    </div>
  </form>
</div>
